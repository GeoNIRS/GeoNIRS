schema_version: geonirs_benchmark_v1
title: 'GeoNIRS: Geometry-Aware Pretraining for Heterogeneous fNIRS Representation Learning'
paper_benchmark:
  datasets:
  - DS7
  - DS47
  - DS36
  - DS19
  - DS70E
  - DS2
  - DS8
  - DS42
  folds: 5
  seeds:
  - 810
  - 811
evaluation:
  split_unit: subject
  selection_metric: validation_balanced_accuracy
  metrics:
  - balanced_accuracy
  - macro_f1
  - auroc
  adaptation_arms:
  - lp
  - lora
  - ft
fair_input:
  policy: B
  policy_name: CHANNEL_INTERSECTION
  missing_value_fill: 0.0
  zero_padding_owner: FairInputBuilder
  model_internal_preprocessing: FORBIDDEN
  allowed_model_operations:
  - reshape
  - permute
  forbidden_model_operations:
  - filtering
  - zscore
  - normalization
  - interpolation
  - channel_selection
  - sample_rejection
  - qc
  - rewinding
  - rewindowing
  geometry_scope: DATASET_LEVEL_FIXED
  geometry_variant: dataset_level_C_normalized_midpoint_delta
  geometry_fields:
  - midpoint_x
  - midpoint_y
  - midpoint_z
  - delta_x
  - delta_y
  - delta_z
  records: benchmark/fair_input/RECORDS.json
  records_sha256: 933b30e9382c911ad0c8dd8875d930b54f4b27742e7f55532c32f2888a03dd91
  index_dir: benchmark/fair_input/index
  tensor: benchmark/fair_input/GEONIRS_FAIR_INPUT.h5
model:
  name: GeoNIRS
  source: model/ours.py
  class: model.ours.Ours
  sizes:
    base:
      parameters: 6511214
      embedding_dim: 192
      temporal_layers: 4
      pretrain_config: pretrain/configs/base.yaml
    large:
      parameters: 30146414
      embedding_dim: 384
      temporal_layers: 6
      pretrain_config: pretrain/configs/large.yaml
  checkpoints:
    base:
      path: pretrain_checkpoint/geonirs_base.pt
      sha256: 0feee1c906d273cd649b6477b932a0cb53906bca91f3cf8c2def486249ec172d
      pretrain_epoch: 64
    mae:
      path: pretrain_checkpoint/geonirs_mae.pt
      sha256: c254348b83ca818c0cb166e29937ffb60c29c1e642bab43c074682175bfbfec0
      pretrain_epoch: 107
    large:
      path: pretrain_checkpoint/geonirs_large.pt
      sha256: null
      note: the large weights are published with the paper; pin their digest in the Hugging Face model
        card before citing a number that was produced with them
